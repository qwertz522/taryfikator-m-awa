<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Przerwa techniczna</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      text-align: center;
    }

    .message {
      padding: 30px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 36px;
    }

    p {
      margin: 0;
      font-size: 18px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="message">
    <h1>Przerwa techniczna</h1>
    <p>Przepraszamy za utrudnienia. Wkrótce wracamy.</p>
  </div>
</body>
</html>
